<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>DNA 12K Simulation — Unwinding / Winding (Single-file)</title>
  <style>html,body{width:100%;height:100%;margin:0;background:#000}canvas{display:block}</style>
</head>
<body>
<!--
  FIXED: Module resolution
  The original file used example modules that rely on bare imports (e.g. `import ... from 'three'`)
  which browsers cannot resolve by themselves. This version loads Three and the example
  modules via a CDN that rewrites module specifiers (esm.sh). That prevents the
  "Failed to resolve module specifier 'three'" runtime error.

  HOW TO RUN
  1) Serve this file from a local web server (strongly recommended):
     python -m http.server 8000
     then open http://localhost:8000/dna_12k_simulation.html
  2) If you see CORS or network errors, try a different CDN in the imports section below.

  NOTE: High-resolution capture (12k) is extremely resource-heavy. Test at smaller
  sizes (2048) first before capturing the full sequence.
-->

<script type="module">
// Use esm.sh to provide ESM-compatible modules with rewritten internal imports.
// esm.sh reliably rewrites example module dependencies so the browser does not encounter
// bare specifier resolution errors.

import * as THREE from 'https://esm.sh/three@0.152.0';
import { OrbitControls } from 'https://esm.sh/three@0.152.0/examples/jsm/controls/OrbitControls.js';
import { EffectComposer } from 'https://esm.sh/three@0.152.0/examples/jsm/postprocessing/EffectComposer.js';
import { RenderPass } from 'https://esm.sh/three@0.152.0/examples/jsm/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'https://esm.sh/three@0.152.0/examples/jsm/postprocessing/UnrealBloomPass.js';

// ---------- CONFIG: change these to alter resolution / duration ----------
const RENDER_WIDTH = 12000;     // target width in px for 12k output
const RENDER_HEIGHT = 12000;    // target height in px (use square for simplicity)
const DURATION_SECONDS = 12;    // length of automated wind/unwind cycle
const FPS = 30;                 // frame rate for captured sequence
// -----------------------------------------------------------------------

// Scene, camera, renderer
const container = document.createElement('div'); document.body.appendChild(container);
const scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(0x000000, 0.00035);

const camera = new THREE.PerspectiveCamera(35, window.innerWidth / window.innerHeight, 0.1, 1000);
camera.position.set(0, 12, 48);

const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 1)); // limit pixel ratio to avoid excessive memory
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.physicallyCorrectLights = true;
container.appendChild(renderer.domElement);

// Controls
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.07;
controls.minDistance = 5;
controls.maxDistance = 200;

// Lighting
const hemi = new THREE.HemisphereLight(0xffffff, 0x080820, 0.9);
scene.add(hemi);
const key = new THREE.DirectionalLight(0xffffff, 1.6);
key.position.set(10, 40, 20);
key.castShadow = true;
scene.add(key);

// Environment: subtle HDR-like ambient using an approximate color
scene.environment = null;

// DNA parameters
const helixRadius = 2.4;
const helixPitch = 0.8; // vertical advance per radian
const helixTurns = 18;  // number of full turns
const helixLength = helixTurns * Math.PI * 2; // full theta range

// Create parametric curve for the center axis (linear)
class HelixCurve extends THREE.Curve {
  constructor(radius, pitch, phase = 0) { super(); this.radius = radius; this.pitch = pitch; this.phase = phase; }
  getPoint(t) {
    const theta = t * helixLength + this.phase;
    const x = this.radius * Math.cos(theta);
    const y = (this.pitch * theta) / (2.0); // scale down pitch to keep helix compact
    const z = this.radius * Math.sin(theta);
    return new THREE.Vector3(x, y - helixTurns * this.pitch / 2.0, z);
  }
}

// Build two strands as TubeGeometry along offset-phase helices
function createStrand(radius, pitch, phase, color) {
  const curve = new HelixCurve(radius, pitch, phase);
  const geometry = new THREE.TubeGeometry(curve, 1600, 0.16, 12, false);
  const mat = new THREE.MeshStandardMaterial({ metalness: 0.1, roughness: 0.35, emissive: color.clone().multiplyScalar(0.05), emissiveIntensity: 1.4 });
  const mesh = new THREE.Mesh(geometry, mat);
  mesh.castShadow = true;
  mesh.receiveShadow = true;
  return { mesh, curve };
}

const strandA = createStrand(helixRadius, helixPitch, 0, new THREE.Color(0x46b6ff));
const strandB = createStrand(helixRadius, helixPitch, Math.PI, new THREE.Color(0xff6f61));
scene.add(strandA.mesh, strandB.mesh);

// Base pairs: evenly spaced short cylinders connecting the two strands
const basePairGroup = new THREE.Group();
const basePairMaterial = new THREE.MeshStandardMaterial({ metalness: 0.0, roughness: 0.25, emissive: new THREE.Color(0xffffff).multiplyScalar(0.02) });

const baseCount = 360; // number of base pairs (tweak for density)
for (let i = 0; i < baseCount; i++) {
  const t = i / (baseCount - 1);
  // sample both curves
  const p1 = strandA.curve.getPoint(t);
  const p2 = strandB.curve.getPoint(t);
  const dir = new THREE.Vector3().subVectors(p2, p1);
  const len = dir.length();
  const cyl = new THREE.CylinderGeometry(0.09, 0.09, len, 10, 1, true);
  // orient cylinder along dir
  const mesh = new THREE.Mesh(cyl, basePairMaterial);
  mesh.position.copy(p1).addScaledVector(dir, 0.5);
  mesh.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), dir.clone().normalize());
  basePairGroup.add(mesh);
}
scene.add(basePairGroup);

// Particle cloud for volumetric feel
const particleCount = 12000;
const particleGeo = new THREE.BufferGeometry();
const pos = new Float32Array(particleCount * 3);
for (let i = 0; i < particleCount; i++) {
  const r = THREE.MathUtils.randFloat(6, 36);
  const theta = THREE.MathUtils.randFloat(0, Math.PI * 2);
  const phi = THREE.MathUtils.randFloat(0, Math.PI);
  const x = r * Math.sin(phi) * Math.cos(theta);
  const y = THREE.MathUtils.randFloatSpread(helixTurns * helixPitch);
  const z = r * Math.sin(phi) * Math.sin(theta);
  pos[i * 3] = x; pos[i * 3 + 1] = y; pos[i * 3 + 2] = z;
}
particleGeo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
const particleMat = new THREE.PointsMaterial({ size: 0.06, transparent: true, opacity: 0.7 });
const particles = new THREE.Points(particleGeo, particleMat);
scene.add(particles);

// Post-processing composer with bloom
const composer = new EffectComposer(renderer);
composer.addPass(new RenderPass(scene, camera));
const bloom = new UnrealBloomPass(new THREE.Vector2(window.innerWidth, window.innerHeight), 1.2, 0.5, 0.1);
bloom.strength = 1.2;
bloom.radius = 0.8;
composer.addPass(bloom);

// Time variables
let clock = new THREE.Clock();
let time = 0;

// Animation parameters for winding/unwinding
// We'll animate a single parameter `twistAmount` from 0 (fully unwound) to 1 (fully wound)
let twistAmount = 1.0;
let autoPlay = true;

// Helper easing
function easeInOutSine(t) { return 0.5 * (1 - Math.cos(Math.PI * t)); }

// Animate: update geometry by rebuilding TubeGeometry with a dynamic pitch multiplier.
function updateStrands(t) {
  // t range 0..1 over DURATION_SECONDS
  const cycle = (t % DURATION_SECONDS) / DURATION_SECONDS; // 0..1
  const anim = easeInOutSine(cycle);
  // twistAmount varies from 0.15 (loose) to 1.0 (tight) for strong visual difference
  twistAmount = THREE.MathUtils.lerp(0.15, 1.0, anim);

  // update helix pitch dynamically by scaling helixPitch
  const dynamicPitch = helixPitch * twistAmount * 1.6; // multiplier to make variance visible

  // Replace meshes' geometry (cheap-ish but acceptable for moderate counts)
  // For extreme performance, reuse geometries and morph attributes instead.
  scene.remove(strandA.mesh, strandB.mesh);
  const newA = createStrand(helixRadius, dynamicPitch, 0, new THREE.Color(0x46b6ff));
  const newB = createStrand(helixRadius, dynamicPitch, Math.PI, new THREE.Color(0xff6f61));
  strandA.mesh.geometry.dispose(); strandB.mesh.geometry.dispose();
  strandA.mesh = newA.mesh; strandA.curve = newA.curve;
  strandB.mesh = newB.mesh; strandB.curve = newB.curve;
  scene.add(strandA.mesh, strandB.mesh);

  // Update base pairs positions to match new curves
  for (let i = 0; i < baseCount; i++) {
    const t = i / (baseCount - 1);
    const p1 = strandA.curve.getPoint(t);
    const p2 = strandB.curve.getPoint(t);
    const dir = new THREE.Vector3().subVectors(p2, p1);
    const len = dir.length();
    const mesh = basePairGroup.children[i];
    mesh.geometry.dispose();
    mesh.geometry = new THREE.CylinderGeometry(0.09, 0.09, len, 10, 1, true);
    mesh.position.copy(p1).addScaledVector(dir, 0.5);
    mesh.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), dir.clone().normalize());
  }
}

// Initial update
updateStrands(0);

// GUI (minimal DOM-based)
const ui = document.createElement('div');
ui.style.position = 'fixed'; ui.style.right = '18px'; ui.style.top = '18px'; ui.style.zIndex = 10;
ui.style.background = 'rgba(0,0,0,0.35)'; ui.style.backdropFilter = 'blur(6px)'; ui.style.padding = '12px'; ui.style.borderRadius = '8px';
ui.style.color = '#fff'; ui.style.fontFamily = 'monospace'; ui.style.fontSize = '13px';
ui.innerHTML = `
  <div style="margin-bottom:8px">DNA — wind/unwind demo</div>
  <div>Duration: <span id="duration">${DURATION_SECONDS}s</span></div>
  <div style="margin-top:8px"><button id="togglePlay">Pause</button> <button id="captureBtn">Capture 12k</button></div>
`;
document.body.appendChild(ui);

const togglePlay = ui.querySelector('#togglePlay');
togglePlay.onclick = () => { autoPlay = !autoPlay; togglePlay.textContent = autoPlay ? 'Pause' : 'Play'; };

const captureBtn = ui.querySelector('#captureBtn');
let capturer = null;
captureBtn.onclick = async () => {
  if (!capturer) {
    // load CCapture dynamically
    try {
      captureBtn.textContent = 'Initializing...';
      await loadScript('https://cdn.jsdelivr.net/npm/ccapture.js@1.1.0/build/CCapture.all.min.js');
      capturer = new window.CCapture({ format: 'png', workersPath: './', framerate: FPS, verbose: true });
      // switch renderer to target resolution
      await startCaptureSequence();
      captureBtn.textContent = 'Capture 12k';
    } catch (e) {
      console.error(e);
      captureBtn.textContent = 'Capture failed';
    }
  } else {
    // stop capture
  }
};

async function startCaptureSequence() {
  // Save original size and set to render target
  const oldSize = renderer.getSize(new THREE.Vector2());
  const oldPixelRatio = renderer.getPixelRatio();

  // For extremely high resolutions, we set pixel ratio to 1 and renderer size to target
  renderer.setPixelRatio(1);
  renderer.setSize(RENDER_WIDTH, RENDER_HEIGHT, false);
  composer.setSize(RENDER_WIDTH, RENDER_HEIGHT);

  // Start capture
  capturer.start();
  const totalFrames = Math.floor(DURATION_SECONDS * FPS);
  for (let f = 0; f < totalFrames; f++) {
    // animate to the exact frame time
    const t = (f / totalFrames) * DURATION_SECONDS;
    updateStrands(t);
    renderFrame();
    capturer.capture(renderer.domElement);
    // yield to event loop so UI remains responsive
    await new Promise(r => setTimeout(r, 10));
    console.log(`captured frame ${f+1}/${totalFrames}`);
  }
  capturer.stop();
  capturer.save();

  // restore old size
  renderer.setPixelRatio(oldPixelRatio);
  renderer.setSize(oldSize.x, oldSize.y, false);
  composer.setSize(oldSize.x, oldSize.y);
}

function loadScript(src) {
  return new Promise((resolve, reject) => {
    const s = document.createElement('script'); s.src = src; s.onload = resolve; s.onerror = reject; document.head.appendChild(s);
  });
}

// Basic render loop
function renderFrame() {
  controls.update();
  composer.render();
}

function animate() {
  requestAnimationFrame(animate);
  const t = clock.getElapsedTime();
  if (autoPlay) updateStrands(t);
  renderFrame();
}
animate();

// window resize handling
window.addEventListener('resize', () => {
  const w = window.innerWidth, h = window.innerHeight;
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
  renderer.setSize(w, h);
  composer.setSize(w, h);
});

</script>
</body>
</html>
